<html lang="zh-CN">
<head>

<title>IELTS 口语 · 短语级拆解记忆</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>
:root {
  --paper:#F7F4EC; --paper-2:#EFE9DB; --paper-3:#E8E0CE; --cream:#FCFAF5;

  --black:#1A1A2E; --red:#A84040; --olive:#5A7A4A; --orange:#B8703A;
}
* {box-sizing:border-box; margin:0; padding:0}
html {scroll-behavior:smooth}
body {
  font-family:"Space Grotesk","Noto Sans TC","Helvetica Neue",sans-serif;
  background:
    radial-gradient(120% 90% at 20% 10%, rgba(255,255,255,.12), transparent 60%),
    var(--paper);
  color:var(--ink); min-height:100vh;
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:.15;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.2  0 0 0 .25 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.container {max-width:900px; margin:0 auto; padding:28px 20px 100px}

/* Cover */
.cover {text-align:center; padding:60px 20px 50px; position:relative}
.cover .pin {display:inline-block; margin-bottom:16px; position:relative}
.cover .pin::before {content:"🧷"; font-size:40px; display:block}
.cover h1 {font-family:"Caveat",cursive; font-size:clamp(36px,6vw,56px); font-weight:700; color:var(--ink); margin-bottom:8px}
.cover .sub {font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase}

/* Tabs */
.tabs {display:flex; gap:4px; flex-wrap:wrap; margin:28px 0; position:sticky; top:8px; z-index:50; background:var(--paper-2); padding:8px}
.tab {font-family:"DM Mono",monospace; font-size:10px; font-weight:500; letter-spacing:.05em; padding:9px 14px; cursor:pointer; border:2px solid var(--ink); color:var(--ink); transition:all .12s; background:var(--paper)}
.tab:hover {background:var(--ink); color:var(--paper)}
.tab.active {background:var(--ink); color:var(--paper)}

/* Stats */
.stats {text-align:center; margin-bottom:28px; font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.06em; color:var(--ink-soft)}
.stats b {color:var(--red)}

/* Story header */
.story-hd {margin:48px 0 24px; padding:16px 20px; background:var(--ink); color:var(--paper)}
.story-hd .sh-id {font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.15em; opacity:.6; margin-bottom:4px}
.story-hd h2 {font-family:"Caveat",cursive; font-size:36px; font-weight:700; letter-spacing:.02em}
.story-hd .sh-info {font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.08em; margin-top:6px; opacity:.6}

/* Scene - a page of phrases */
.scene-page {margin-bottom:40px; padding:32px 28px; background:var(--cream); border:2px solid var(--ink); position:relative}
@media (max-width:500px) {.scene-page {padding:20px 14px}}

/* Safety pin decoration */
.scene-page::before {
  content:""; position:absolute; top:-12px; left:24px;
  width:28px; height:28px; border-radius:50%;
  border:3px solid var(--red);
  background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.8) 0%, transparent 60%);
  box-shadow:inset 0 0 0 3px var(--cream);
}

.scene-label {font-family:"DM Mono",monospace; font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--red); margin-bottom:16px}

/* Sentence block */
.sent-block {margin-bottom:24px; padding:16px 18px; background:var(--paper); border-left:3px solid var(--ink-line)}
.sent-block .full-en {font-family:"Space Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--ink); line-height:1.6; margin-bottom:14px; padding-bottom:12px; border-bottom:1px dashed var(--kraft)}
.sent-block .full-cn {font-size:12px; color:var(--ink-soft); margin-bottom:12px; font-family:"Noto Sans TC","Space Grotesk",sans-serif; line-height:1.6}

/* Phrase grid */
.phrase-grid {display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.phrase-chip {display:inline-flex; flex-direction:column; align-items:center; padding:6px 10px; background:var(--paper-2); border:1px solid var(--kraft); transition:all .12s; cursor:default; min-width:40px}
.phrase-chip:hover {background:var(--paper-3); transform:translateY(-2px)}
.phrase-chip .p-en {font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; letter-spacing:.02em}
.phrase-chip .p-cn {font-size:10px; color:var(--ink-soft); white-space:nowrap; margin-top:2px; font-family:"Noto Sans TC","Space Grotesk",sans-serif; font-weight:500}
.phrase-arrow {color:var(--kraft); font-size:11px; font-weight:700; padding:0 2px}

/* Back to top */
.back-top {display:block; text-align:center; margin-top:48px; padding:14px; font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.08em; color:var(--ink); text-decoration:none; border:2px solid var(--ink); transition:all .12s; background:var(--cream)}
.back-top:hover {background:var(--ink); color:var(--paper)}

/* Collapse */
.scene-toggle {display:none}
.scene-toggle:checked + .scene-inner {display:none}
.scene-inner {display:block}
.scene-toggle-btn {display:inline-block; font-family:"DM Mono",monospace; font-size:9px; letter-spacing:.1em; cursor:pointer; color:var(--ink-soft); margin-left:12px; text-decoration:underline}
</style>
</head>

 cn:"至于发挥想象力——交易需要你去想象市场接下来可能的走势，并据此制定计划。这不是幻想，是有框架的推理。",
 phrases:[
  ["As for","至于"],["using imagination","发挥想象力"],
  ["trading requires you to","交易需要你"],["imagine","想象"],["where the market might go","市场可能走向哪里"],
  ["next","接下来"],["and plan accordingly","并相应地计划"],
  ["It's not fantasy","这不是幻想"],["it's structured reasoning","这是有框架的推理"]
 ]}
]}
]}
];

// ===== RENDER =====
let currentStory = 'ALL';
let totalPhrases = 0;
stories.forEach(st => st.scenes.forEach(sc => sc.sentences.forEach(s => totalPhrases += s.phrases.length)));
document.getElementById('totalPhrases').textContent = totalPhrases;

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '<button class="tab'+(currentStory==='ALL'?' active':'')+'" onclick="selectStory(\'ALL\')">ALL ('+totalPhrases+'块)</button>' +
    stories.map(st => {
      const n = st.scenes.reduce((sum,sc)=>sum+sc.sentences.reduce((s2,s)=>s2+s.phrases.length,0),0);
      return '<button class="tab'+(currentStory===st.id?' active':'')+'" onclick="selectStory(\''+st.id+'\')">'+st.id+'. '+st.title+' ('+n+'块)</button>';
    }).join('');
}

function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderContent() {
  const el = document.getElementById('content');
  const filtered = currentStory==='ALL' ? stories : stories.filter(s=>s.id===currentStory);
  let html = '';
  let sceneCounter = 0;

  filtered.forEach(st => {
    html += '<div class="story-hd"><div class="sh-id">Story '+st.id+'</div><h2>'+st.title+'</h2><div class="sh-info">'+st.scenes.length+' 场景 · '+st.scenes.reduce((sum,sc)=>sum+sc.sentences.reduce((s2,s)=>s2+s.phrases.length,0),0)+' 个短语块</div></div>';

    st.scenes.forEach(sc => {
      sceneCounter++;
      html += '<div class="scene-page"><div class="scene-label">场景 '+(sceneCounter)+' · '+sc.label+'</div>';

      sc.sentences.forEach((sent, si) => {
        html += '<div class="sent-block">';
        html += '<div class="full-en">'+sent.en+'</div>';
        html += '<div class="full-cn">'+sent.cn+'</div>';
        html += '<div class="phrase-grid">';
        sent.phrases.forEach((ph, pi) => {
          html += '<div class="phrase-chip"><span class="p-en">'+ph[0]+'</span><span class="p-cn">'+ph[1]+'</span></div>';
          if (pi < sent.phrases.length - 1) {
            html += '<span class="phrase-arrow">+</span>';
          }
        });
        html += '</div></div>';
      });

      html += '</div>';
    });
  });

  el.innerHTML = html || '<p style="text-align:center;padding:60px;color:var(--ink-soft)">无数据</p>';
}

function selectStory(s) { currentStory = s; renderTabs(); renderContent(); window.scrollTo({top:0,behavior:'smooth'}); }

// Init
renderTabs();
renderContent();
</script>
