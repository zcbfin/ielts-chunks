<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Task 2 短语库 · Simon 28篇精华拆解</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root {--paper:#F7F4EC; --paper-2:#EFE9DB; --paper-3:#E8E0CE; --cream:#FCFAF5; --kraft:#B8A088; --ink:#2C3E50; --ink-soft:#4A6274; --black:#1A1A2E; --red:#A84040; --olive:#5A7A4A}
* {box-sizing:border-box; margin:0; padding:0}
body {font-family:"Space Grotesk","Noto Sans TC","Helvetica Neue",sans-serif; background:#1a1a1a; color:var(--ink); min-height:100vh}
body::before {content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.12; mix-blend-mode:multiply; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0 0.2 0 0 0 .2 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.topbar {position:sticky; top:0; z-index:100; background:rgba(26,26,26,.94); backdrop-filter:blur(12px); border-bottom:1.5px solid rgba(44,62,80,.25); padding:14px 28px; color:var(--paper); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px}
.topbar h1 {font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em; color:var(--paper); display:flex; align-items:center; gap:8px}
.stats {font-family:"DM Mono",monospace; font-size:12px; color:var(--kraft); display:flex; gap:20px; flex-wrap:wrap; letter-spacing:.08em; text-transform:uppercase}
.stats .sn {color:var(--paper); font-weight:700; font-size:14px}
.controls {padding:18px 28px 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; max-width:1300px; margin:0 auto; position:relative; z-index:1}
.controls input {flex:1; min-width:160px; max-width:320px; padding:9px 16px; border-radius:4px; border:1.5px solid var(--ink); background:var(--cream); color:var(--ink); font-family:"Space Grotesk",sans-serif; font-size:14px; outline:none}
.controls input:focus {border-color:var(--red); box-shadow:0 0 0 3px rgba(168,64,64,.12)}
.btn {padding:9px 18px; border-radius:4px; border:1.5px solid var(--ink); background:var(--cream); color:var(--ink); font-family:"Space Grotesk",sans-serif; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .12s; letter-spacing:-.005em}
.btn:hover {background:var(--paper-2); box-shadow:2px 3px 0 0 var(--ink)}
.btn.active {background:var(--ink); color:var(--paper); border-color:var(--ink)}
.progress-wrap {max-width:1300px; margin:0 auto; padding:0 28px; position:relative; z-index:1}
.progress-bar {height:3px; background:rgba(44,62,80,.15); border-radius:1px; overflow:hidden}
.progress-bar .fill {height:100%; background:var(--ink); border-radius:1px; transition:width .3s}

.badge-bar {max-width:1300px; margin:0 auto; padding:8px 28px 0; display:flex; gap:6px; flex-wrap:wrap; position:relative; z-index:1}
.badge {font-family:"DM Mono",monospace; font-size:10px; font-weight:600; padding:5px 14px; border-radius:12px; border:1.5px solid var(--ink); background:var(--cream); color:var(--ink); cursor:pointer; letter-spacing:.06em; transition:all .12s}
.badge:hover {background:var(--paper-2)}
.badge.active {background:var(--ink); color:var(--paper); border-color:var(--ink)}

/* Grid */
.grid {max-width:1300px; margin:0 auto; padding:18px 28px 60px; display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; position:relative; z-index:1}
@media (max-width:500px) {.grid {grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; padding:12px 12px 60px}}
.flip-card {perspective:800px; height:200px; cursor:pointer; position:relative}
.flip-card-inner {position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d}
.flip-card-inner.flipped {transform:rotateY(180deg)}
.flip-card-front, .flip-card-back {position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 14px; text-align:center; border-radius:6px; border:2px solid var(--ink); background:var(--paper); overflow:hidden}
.flip-card-back {transform:rotateY(180deg); background:var(--ink); color:var(--paper)}
.flip-card-front .cn {font-family:"Noto Sans TC","Space Grotesk",sans-serif; font-size:15px; font-weight:600; color:var(--ink); word-break:break-word; line-height:1.3}
.flip-card-back .en {font-family:"Space Grotesk",sans-serif; font-size:15px; font-weight:700; color:var(--paper); word-break:break-word; line-height:1.3}
.flip-card-back .tag {font-family:"DM Mono",monospace; font-size:9px; letter-spacing:.08em; color:var(--kraft); margin-top:8px; text-transform:uppercase}
.flip-card .num {position:absolute; top:8px; left:12px; font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.06em; color:var(--ink); opacity:.35}
.flip-card .cat-tag {position:absolute; top:8px; right:12px; font-family:"DM Mono",monospace; font-size:8px; letter-spacing:.06em; color:var(--red); opacity:.6; text-transform:uppercase}
.flip-card.known .flip-card-front {border-color:var(--olive)}
.flip-card.known .flip-card-front::after {content:"✓"; position:absolute; bottom:8px; right:14px; font-size:16px; color:var(--olive)}
.flip-card:hover .flip-card-front {transform:translateY(-2px)}

/* Study Mode */
.study-view {display:none; max-width:680px; margin:0 auto; padding:28px 20px; position:relative; z-index:1}
.study-view.visible {display:block}
.study-card-container {perspective:1200px; cursor:pointer; margin-bottom:28px}
.study-card-inner {position:relative; width:100%; transition:transform .55s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d}
.study-card-inner.flipped {transform:rotateY(180deg)}
.study-front, .study-back {width:100%; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 36px; text-align:center; border-radius:8px; border:3px solid var(--ink)}
.study-front {background:var(--paper); min-height:320px}
.study-back {background:var(--ink); color:var(--paper); transform:rotateY(180deg); position:absolute; top:0; left:0; right:0; min-height:100%}
.study-front .cn-big {font-family:"Noto Sans TC","Space Grotesk",sans-serif; font-size:clamp(22px,5vw,32px); font-weight:600; color:var(--ink); word-break:break-word; line-height:1.3; position:relative; z-index:1}
.study-front .ct {font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.08em; color:var(--red); text-transform:uppercase; position:relative; z-index:1; margin-top:10px}
.study-back .en-big {font-family:"Space Grotesk",sans-serif; font-size:clamp(22px,5vw,32px); font-weight:700; color:var(--paper); word-break:break-word; line-height:1.25; position:relative; z-index:1}
.study-back .ct {font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.08em; color:var(--kraft); text-transform:uppercase; position:relative; z-index:1}
.study-front .idx {position:absolute; top:20px; left:24px; font-family:"DM Mono",monospace; font-size:14px; opacity:.4}
.study-nav {display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:14px}
.study-nav .btn {font-size:14px; padding:13px 28px}
.study-nav .btn-flip {font-size:24px; letter-spacing:3px; padding:16px 36px; font-weight:700; background:var(--ink); color:var(--paper); border-color:var(--ink)}
.study-nav .btn-flip:hover {background:var(--black); border-color:var(--black)}
.study-counter {text-align:center; color:var(--paper); opacity:.5; font-family:"DM Mono",monospace; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; margin-bottom:24px}
.study-actions {display:flex; justify-content:center; gap:10px; flex-wrap:wrap}
.study-actions .btn.marked {background:var(--olive); color:var(--paper); border-color:var(--olive)}
.hint-text {text-align:center; color:var(--paper); opacity:.3; font-size:10px; margin-top:14px; letter-spacing:1px; text-transform:uppercase}
.hidden {display:none !important}

@media (max-width:500px) {.study-front .cn-big {font-size:20px} .study-back .en-big {font-size:20px} .study-front, .study-back {padding:32px 20px} .study-front {min-height:260px}}
</style>
</head>

// ═══════════════════════════════════════════════════════════
// 271-296. BODY段6大句型模板（可填空，考场直接套）
// 每个句型 = 完整句子骨架 + 填空位置 + 真实Simon例句
// ═══════════════════════════════════════════════════════════

// ---- 句型1: 主动表态 Topic Sentence（Body段第一句）----
["句型1","句型1·Topic 主动表态：我接受...但我认为...（部分同意最安全）","While I accept that [对方观点的合理部分], I believe that [我的核心论点].","While I accept that money is necessary to meet basic needs, I believe that other factors are equally important. 【Simon范文4】","Body1开头万能句型—先承认对方再转回自己立场"],
["句型1","句型1·Topic 让步转折：尽管...，我认为...","Although [承认对方观点], I would argue that [我更支持的立场].","Although it can be argued that governments could save money by allowing endangered languages to disappear, I believe that these languages should be protected. 【Simon范文18】","Although开头=更正式。I would argue that比I believe that语气更强"],
["句型1","句型1·Topic 直接表态（完全同意/不同意时用）","I completely agree/disagree with the idea that [改写题目观点].","I completely disagree with the idea that universities should accept equal numbers of male and female students in every subject. 【Simon范文15】","一边倒立场时用。completely=完全—语气要坚定"],
["句型1","句型1·Topic 引出原因（讨论型/Report型Body第一句）","There are [two/several] reasons why [你要论证的论点].","There are two main reasons why it could be argued that we are more dependent on each other now. 【Simon范文3】","引出原因的万能开头。后面接Firstly...Secondly..."],

// ---- 句型2: There be / It is 引出论证（Body段核心展开） ----
["句型2","句型2·论证展开 There be 引出问题/原因","There is/are [数量] [问题/原因/措施] that [引出你要讨论的内容].","There are several actions that governments could take to solve the problems described above. 【Simon范文10】","比S+V句型更客观、更正式。特别适合Report题型的措施/问题段"],
["句型2","句型2·论证展开 It is + adj + that 强调重要性","It is [vitally/particularly/extremely] important that [论证要点].","It is vitally important to educate people properly before they start to drive. 【Simon范文22】","强调某事极其重要。vitally > extremely > very 按强度递增"],
["句型2","句型2·论证展开 It is + adj + to do 引出观点","It is [difficult/easy/possible/impossible/common] to [做某事] without [前提条件].","It is hard for a person to be happy if he or she does not have a safe place to live and enough food to eat. 【Simon范文20】","引出必要条件。without后面接缺失条件。if后面接假设条件"],
["句型2","句型2·论证展开 It seems...that 委婉表达立场","It seems to me that [委婉表达观点] / It seems logical that [合乎逻辑的推论].","It seems logical that the priority of any company should be to cover its running costs. 【Simon范文23】","更委婉、更学术化的表达。不直接用I think，用It seems"],

// ---- 句型3: 因果逻辑链 Cause→Effect（Body段第2-3句）----
["句型3","句型3·因果 This is because 直接解释原因","[中心句]. This is because [解释这个观点的原因].","Young adults tend to rely on their parents for help when buying a house. This is because property prices are higher than ever, and without help it would be impossible to pay a deposit and a mortgage. 【Simon范文3】","最常用的因果句—引出前一句的原因。中心句→This is because→展开解释"],
["句型3","句型3·因果 This means that 推导结果","[前句]. This means that [由前句推导出的结果].","In most countries, families are becoming smaller and more dispersed. This means that people cannot count on relatives as much as they used to. 【Simon范文3】","This means that = 前因→后果。从现象推导出影响"],
["句型3","句型3·因果 As a result / Therefore 总结后果","[前1-2句论述]. As a result, [由前述所有内容得出的结论性后果].","These artworks represent culture, heritage and history. They serve to educate people about the city. As a result, governments and local councils should pay creative artists to produce this kind of art. 【Simon范文6】","多句铺垫后用As a result收束。前因→后果→推导出的行动建议"],
["句型3","句型3·因果 If...then 假设条件推导","If [假设条件成立], then [会产生的后果]. / If [条件], [主语] would [后果].","If a company is unable to pay its bills or meet the changing needs of customers, any concerns about social responsibilities become irrelevant. 【Simon范文23】","假设推理—论证为什么某个条件很重要。would/could/might表示可能性"],

// ---- 句型4: 举例论证 Example（Body段第4句）----
["句型4","句型4·举例 For example + 具体例子（最常用）","For example, [具体的人/国家/数据] [做了/展示了什么].","For example, rainforests produce oxygen, absorb carbon dioxide and stabilise the Earth's climate. 【Simon范文21】","For example后面接一个完整的句子。不要只列名词—要描述动作和结果"],
["句型4","句型4·举例 For instance + 具体案例","For instance, [具体案例].","For instance, many students choose to study abroad instead of going to their local university, and this experience makes them more independent. 【Simon范文3】","For instance比For example稍正式。可以互换。后面接2-3句展开案例"],
["句型4","句型4·举例 Take...as an example 带入式举例","To take [国家/行业/群体] as an example, [具体说明].","To take the UK as an example, the tourism industry and many related jobs rely on visitors coming to the country to see places like Windsor Castle. 【Simon范文2】","更自然地带入一个具体的案例。比For example更生动"],
["句型4","句型4·举例 such as + 并列举例","[泛论点], such as [例子1], [例子2] and [例子3].","State budgets need to be spent on education, healthcare, infrastructure and security, among other areas. 【Simon范文6】","罗列2-4个例子。不需要每个详细展开—快速并列即可"],

// ---- 句型5: 对比反证 Contrast（Body段第5句收束/反向论证）----
["句型5","句型5·对比 By contrast / However 引出反向","[自己的论点]. By contrast, [相反的/不支持此论点的情况].","Car use accounted for 53% in the US. By contrast, a mere 15% of people cycled to work.","By contrast放在句首，后面接与前一论点相反的数据或事实。小作文大作文通用"],
["句型5","句型5·反面论证 If...not / Without 反证必要性","If [某条件不成立], [主语] would [负面后果]. / Without [某条件], [主语] would not [正面结果].","If we destroyed these areas, the costs of managing the resulting changes to our planet would far outweigh the costs of conservation. 【Simon范文21】","反面论证的力量：证明某事物的必要性，不是说它好，而是说没有它会怎样"],
["句型5","句型5·让步对比 While X..., Y...（一句两端）","While [A的情况], [B的情况相反].","While most hotel guests rated customer service as satisfactory or poor in 2005, a clear majority described the hotel's service as good or excellent in 2010.","While + 前半句（承认/让步）+ 后半句（转折/对比）。一句话完成对比，高效"],
["句型5","句型5·最高级强调 the most + adj / by far the most","[X] is the most [adj] [名词] in [范围] / [X] is by far the most significant/important + [名词].","He is the most unique figure in baseball history — a two-way player, both an ace pitcher and a star hitter.","用最高级来强调某事物的极端重要性。by far + 最高级 = 远远最..."],

// ---- 句型6: 结论收束 Conclusion（Body段第5句/结论段）----
["句型6","句型6·回扣中心句  In other words / This shows that","[一段论述后]. In other words, [换一种说法回扣本段中心论点].","In other words, an ageing population will mean a greater tax burden for working adults. 【Simon范文10】","用更简洁的话重新阐述本段的论点。In other words = 换言之"],
["句型6","句型6·难驳倒的反问论证","It is difficult to [否定你的论点] when [一个无法反驳的事实].","It is difficult to justify such spending when basic public services remain underfunded.","用反问/难驳倒的结构收尾。It is difficult/hard to argue against... when..."],
["句型6","句型6·总结全段递进逻辑","[本段前半的论点], and [进一步推导]. This is surely [总结定论].","Currently, nobody is forced to volunteer, and this is surely the best system. 【Simon范文7】","从前面的推理自然而然地得出一个不容置疑的结论。surely = 无疑"],
["句型6","句型6·结论段万能句 In conclusion 换词重申立场","In conclusion, while [承认对方合理之处], I believe that [重申我的核心立场].","In conclusion, while there are some reasons to believe that people now depend on each other more, my own view is that we are more independent than ever. 【Simon范文3】","Discussion题型的万能结论。while承认对方+I believe重申自己。换词不要照抄Introduction"],

// ---- 句型7: 一整个Body段的组装示范（把上面6种句型拼成一段） ----
["句型7","句型7·Opinion型Body段组装示范：Topic→Explain→Example→Contrast→Conclude","句1(Topic): While I accept that [承认对方], I believe that [我的论点]. 句2(Explain): This is because [原因]. 句3(Develop): If [反向假设], then [负面后果]. 句4(Example): For example, [具体例子]. 句5(Conclude): In other words, [重述论点].","【对照Simon范文4 Body段】句1: On the one hand, I agree that money is necessary in order for people to meet their basic needs. 句2: This is because we all need money to pay for housing, food, bills, health care, and education. 句3→句4: For example, artists and musicians... 句5: If people chose their jobs based on enjoyment alone, they might find it difficult to support themselves.","Opinion题5句组装模板。一个Body段用5个句子、从3-4种不同句型拼成。不要只用S+V！"],
["句型7","句型7·Report型Body段组装示范：Topic→There be→Explain→Example→Result","句1(Topic): There are several problems that [引出问题]. 句2(Explain): The main issue is that [具体问题+This is because原因]. 句3(Example): For example, [具体例子]. 句4(Result): As a result, [这个问题的后果]. 句5(Conclude): In other words, [总结].","【对照Simon范文10 Body段】句1: As people live longer, several related problems can be anticipated. 句2: The main issue is that there will be more people of retirement age... 句3: This means that the proportion of younger adults will be smaller... 句4: Further pressures will include a rise in demand for healthcare...","Report型5句组装模板。用There be引出问题→This means that解释→Further...扩展"],
["句型7","句型7·Discussion型Body段组装示范：Topic→It is→Explain→Contrast→Conclude","句1(Topic): On the one hand, it can be argued that [观点A]. 句2(Explain): This is because [原因]. 句3(Contrast): However, I believe this to be a very shortsighted view. 句4(Explain): [我的观点+原因]. 句5(Conclude): If [假设], [会怎样].","【对照Simon范文2 Body1】句1: The argument in favour of higher prices for foreign tourists would be that cultural attractions often depend on state subsidies... 句2: This means that residents already pay through the tax system. 句3: However, I believe this to be a very shortsighted view. 句4: Foreign tourists contribute to the economy...","Discussion题Body段模板。先讲对方观点（1-2句）→However转→我为什么不同意（2-3句）→反证收尾"]
];

// Build category badges dynamically
const cats = [...new Set(phrases.map(p=>p[0]))];
const catNames = {
  "INTRO":"Intro 开头模板",
  "TOPIC":"Topic 中心句",
  "CAUSE":"Cause 原因解释",
  "EXAMPLE":"Example 举例",
  "CONTRAST":"Contrast 对比让步",
  "RESULT":"Result 结果影响",
  "CONCLUSION":"Conclusion 结论",
  "COL-G":"Collocation 通用搭配",
  "COL-T":"Collocation 话题搭配",
  "句型1":"句型1 Topic 主动表态",
  "句型2":"句型2 There be/It is 展开",
  "句型3":"句型3 Cause→Effect 因果",
  "句型4":"句型4 Example 举例论证",
  "句型5":"句型5 Contrast 对比反证",
  "句型6":"句型6 Conclude 结论收束",
  "句型7":"句型7 Body段组装示范"
};

let catFilter = 'ALL';
let currentOrder = phrases.map((_,i)=>i);
let knownSet = new Set();
let currentStudyIdx = 0;
let viewMode = 'grid';

// Build badges (group 句型1-7 under one badge)
(function(){
  const bb = document.getElementById('badgeBar');
  bb.innerHTML = '<button class="badge active" data-cat="ALL">ALL ('+phrases.length+')</button>';

  // Group 句型* categories
  const groupedCats = {};
  const formulaCats = {};
  cats.forEach(c => {
    if (c.match(/^句型/)) {
      formulaCats[c] = phrases.filter(p=>p[0]===c).length;
    } else {
      groupedCats[c] = phrases.filter(p=>p[0]===c).length;
    }
  });

  // Add formula badge (all 句型 combined)
  const formulaTotal = Object.values(formulaCats).reduce((a,b)=>a+b,0);
  if (formulaTotal > 0) {
    bb.innerHTML += '<button class="badge" data-cat="FORMULA">句型模板 ('+formulaTotal+')</button>';
  }

  // Add individual category badges
  Object.keys(groupedCats).sort().forEach(c => {
    bb.innerHTML += '<button class="badge" data-cat="'+c+'">'+c+' ('+groupedCats[c]+')</button>';
  });
})();

const grid=document.getElementById('grid'), searchInput=document.getElementById('searchInput');
const studyView=document.getElementById('studyView'), studyCardInner=document.getElementById('studyCardInner');
const studyEnEl=document.getElementById('studyEn'), studyCnEl=document.getElementById('studyCn'), studyCatEl=document.getElementById('studyCat');
const studyIdxEl=document.getElementById('studyIdx'), studyCounter=document.getElementById('studyCounter');
const studyCardContainer=document.getElementById('studyCardContainer');
const flipCountEl=document.getElementById('flipCount'), knownCountEl=document.getElementById('knownCount');
const progressPct=document.getElementById('progressPct'), progressBar=document.getElementById('progressBar');

function totalVisible(){return currentOrder.length}
function updateStats(){
  let flipped=document.querySelectorAll('.flip-card-inner.flipped').length+(viewMode==='study'&&studyCardInner.classList.contains('flipped')?1:0);
  flipCountEl.textContent=flipped; knownCountEl.textContent=knownSet.size;
  progressPct.textContent=Math.round(knownSet.size/phrases.length*100)+'%';
  progressBar.style.width=Math.round(knownSet.size/phrases.length*100)+'%';
}

function applyFilters(){
  const q=searchInput.value.trim().toLowerCase();
  currentOrder=phrases.map((_,i)=>i).filter(i=>{
    if(catFilter==='FORMULA'){if(!phrases[i][0].match(/^句型/)) return false}
    else if(catFilter!=='ALL'&&phrases[i][0]!==catFilter) return false;
    if(!q) return true;
    return phrases[i][1].toLowerCase().includes(q)||phrases[i][2].includes(q);
  });
  currentStudyIdx=0; renderGrid(); renderStudyCard(); updateStats();
}

function renderGrid(){
  grid.innerHTML='';
  currentOrder.forEach((idx,pos)=>{
    const p=phrases[idx];
    const card=document.createElement('div');
    card.className='flip-card'+(knownSet.has(idx)?' known':'');
    card.dataset.idx=idx;
    card.innerHTML='<div class="flip-card-inner"><div class="flip-card-front"><span class="num">#'+(pos+1)+'</span><span class="cat-tag">'+p[0]+'</span><span class="cn">'+p[2]+'</span></div><div class="flip-card-back"><span class="en">'+p[1]+'</span><span class="tag">'+catNames[p[0]]+'</span></div></div>';
    card.addEventListener('click',()=>{
      const inner=card.querySelector('.flip-card-inner');
      inner.classList.toggle('flipped');
      if(inner.classList.contains('flipped')) knownSet.add(idx);
      card.classList.toggle('known',knownSet.has(idx));
      updateStats();
    });
    grid.appendChild(card);
  });
}

function renderStudyCard(){
  if(totalVisible()===0){studyEnEl.textContent='(none)'; studyCnEl.textContent=''; studyCatEl.textContent=''; studyIdxEl.textContent=''; return}
  if(currentStudyIdx>=totalVisible()) currentStudyIdx=0;
  if(currentStudyIdx<0) currentStudyIdx=totalVisible()-1;
  const p=phrases[currentOrder[currentStudyIdx]];
  studyEnEl.textContent=p[1]; studyCnEl.textContent=p[2]; studyCatEl.textContent=catNames[p[0]]; studyCatEl.style.display='block';
  studyIdxEl.textContent='#'+(currentStudyIdx+1);
  studyCounter.innerHTML=(currentStudyIdx+1)+' / '+totalVisible();
  studyCardInner.classList.remove('flipped');
  document.getElementById('btnMarkKnown').classList.toggle('marked',knownSet.has(currentOrder[currentStudyIdx]));
}

function flipStudy(){
  studyCardInner.classList.toggle('flipped');
  if(studyCardInner.classList.contains('flipped')){
    knownSet.add(currentOrder[currentStudyIdx]);
    document.getElementById('btnMarkKnown').classList.add('marked');
  }
  updateStats();
}
function goNext(){if(totalVisible()>0){currentStudyIdx=(currentStudyIdx+1)%totalVisible(); renderStudyCard()}}
function goPrev(){if(totalVisible()>0){currentStudyIdx=(currentStudyIdx-1+totalVisible())%totalVisible(); renderStudyCard()}}

searchInput.addEventListener('input',applyFilters);
document.querySelectorAll('.badge').forEach(badge=>{badge.addEventListener('click',()=>{catFilter=badge.dataset.cat; document.querySelectorAll('.badge').forEach(b=>b.classList.remove('active')); badge.classList.add('active'); applyFilters()})});
document.getElementById('btnShuffle').addEventListener('click',()=>{const arr=[...currentOrder]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]} currentOrder=arr; currentStudyIdx=0; renderGrid(); renderStudyCard()});
document.getElementById('btnReset').addEventListener('click',()=>{catFilter='ALL'; searchInput.value=''; document.querySelectorAll('.badge').forEach(b=>b.classList.remove('active')); document.querySelector('.badge[data-cat="ALL"]').classList.add('active'); applyFilters()});
document.getElementById('btnFlipAll').addEventListener('click',()=>{document.querySelectorAll('.flip-card-inner.flipped').forEach(el=>el.classList.remove('flipped')); studyCardInner.classList.remove('flipped'); updateStats()});

document.getElementById('btnGridView').addEventListener('click',()=>switchView('grid'));
document.getElementById('btnStudyView').addEventListener('click',()=>switchView('study'));
function switchView(mode){viewMode=mode; document.getElementById('btnGridView').classList.toggle('active',mode==='grid'); document.getElementById('btnStudyView').classList.toggle('active',mode==='study'); grid.classList.toggle('hidden',mode!=='grid'); studyView.classList.toggle('visible',mode==='study'); if(mode==='study') renderStudyCard(); updateStats()}

document.getElementById('btnFlipStudy').addEventListener('click',flipStudy);
document.getElementById('btnPrev').addEventListener('click',goPrev);
document.getElementById('btnNext').addEventListener('click',goNext);
document.getElementById('studyCardContainer').addEventListener('click',flipStudy);
document.getElementById('btnMarkKnown').addEventListener('click',()=>{if(totalVisible()===0) return; const realIdx=currentOrder[currentStudyIdx]; knownSet.add(realIdx); document.getElementById('btnMarkKnown').classList.add('marked'); updateStats(); const gc=document.querySelector('.flip-card[data-idx="'+realIdx+'"]'); if(gc) gc.classList.add('known')});
document.getElementById('btnStudyShuffle').addEventListener('click',()=>{if(totalVisible()===0) return; currentStudyIdx=Math.floor(Math.random()*totalVisible()); renderStudyCard()});

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT') return; if(viewMode==='study'){if(e.key===' '||e.code==='Space'){e.preventDefault();flipStudy()}else if(e.key==='ArrowRight'){e.preventDefault();goNext()}else if(e.key==='ArrowLeft'){e.preventDefault();goPrev()}else if(e.key==='m'||e.key==='M'){e.preventDefault();document.getElementById('btnMarkKnown').click()}}});

renderGrid(); updateStats();
</script>
