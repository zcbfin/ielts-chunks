<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>IELTS 口语 · 语料逐块拆解</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {--bg:#FCFAF5; --card:#FFFFFF; --ink:#1A1A1A; --muted:#8C8C8C; --line:#E5E0D5; --red:#D94A4A; --blue:#4A7FD9; --green:#3D8C40; --amber:#C77D20; --tag-bg:#F3F0E8}
* {box-sizing:border-box; margin:0; padding:0}
body {font-family:"Inter","Noto Serif TC",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh}
.container {max-width:900px; margin:0 auto; padding:28px 20px 80px}

/* Top */
.top {text-align:center; padding:40px 0 32px; border-bottom:1px solid var(--line); margin-bottom:36px}
.top .kicker {font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
.top h1 {font-size:clamp(28px,5vw,40px); font-weight:700; letter-spacing:-.02em; margin-bottom:8px}
.top .sub {font-size:14px; color:var(--muted); line-height:1.6}

/* Tabs */
.tabs {display:flex; gap:4px; flex-wrap:wrap; margin-bottom:36px; position:sticky; top:12px; z-index:50; background:var(--bg); padding:8px 0}
.tab {font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:600; letter-spacing:.05em; padding:10px 16px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--muted); transition:all .12s}
.tab:hover {border-color:var(--ink); color:var(--ink)}
.tab.active {background:var(--ink); color:var(--card); border-color:var(--ink)}
.tab .cnt {opacity:.5; margin-left:4px; font-size:9px}

/* View toggle */
.view-bar {display:flex; align-items:center; gap:12px; margin-bottom:24px; flex-wrap:wrap}
.view-btn {font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600; letter-spacing:.06em; padding:8px 16px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--muted); transition:all .12s}
.view-btn.active {background:var(--ink); color:var(--card); border-color:var(--ink)}
.view-bar .hint {font-size:11px; color:var(--muted); font-style:italic}

/* Story header */
.story-hd {margin:40px 0 20px; padding-bottom:12px; border-bottom:2px solid var(--ink)}
.story-hd .sh-tag {font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; margin-bottom:6px}
.story-hd h2 {font-size:24px; font-weight:700; letter-spacing:-.01em}
.story-hd .sh-meta {font-size:12px; color:var(--muted); margin-top:4px}

/* Scene block */
.scene-wrap {margin-bottom:32px}
.scene-label {font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); margin-bottom:12px; padding:4px 10px; background:var(--tag-bg); display:inline-block}

/* CHUNK VIEW */
.chunk {margin-bottom:10px; padding:14px 16px; background:var(--card); border-left:3px solid var(--line); transition:all .15s}
.chunk:hover {border-left-color:var(--ink)}
.chunk .c-cn {font-size:13px; line-height:1.7; color:var(--ink); margin-bottom:6px; font-family:"Noto Serif TC","Inter",sans-serif}
.chunk .c-en {font-size:14px; line-height:1.7; color:var(--ink); font-weight:500}
.chunk .c-note {font-size:10px; color:var(--blue); margin-top:4px; font-family:"JetBrains Mono",monospace; letter-spacing:.03em}
.chunk .c-note::before {content:"💡 "}

/* CHAIN VIEW */
.chain-view {display:none}
.chain-view.visible {display:block}
.chain-block {margin-bottom:32px; padding:24px 28px; background:var(--card); border:1px solid var(--line)}
.chain-block .chain-en {font-size:15px; line-height:2; color:var(--ink)}
.chain-block .chain-en .arrow {color:var(--muted); margin:0 4px; font-size:12px}
.chain-block .chain-cn {font-size:12px; line-height:1.8; color:var(--muted); margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); font-family:"Noto Serif TC","Inter",sans-serif}
.chunk-view.hidden {display:none}

/* Flow line */
.flow-line {display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:16px 0; padding:14px 16px; background:var(--card); border:1px solid var(--line); overflow-x:auto}
.flow-node {padding:6px 12px; font-size:11px; font-weight:600; white-space:nowrap; font-family:"JetBrains Mono",monospace; letter-spacing:.03em; background:var(--tag-bg)}
.flow-arrow {color:var(--muted); font-size:14px; flex-shrink:0}

.back-top {display:block; text-align:center; margin-top:48px; padding:14px; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.08em; color:var(--muted); text-decoration:none; border:1px solid var(--line); transition:all .12s}
.back-top:hover {color:var(--ink); border-color:var(--ink)}

@media (max-width:500px) {.container {padding:16px 10px 80px} .chunk {padding:12px 14px}}
</style>
</head>
<body>
<div class="container">

<div class="top">
  <div class="kicker">IELTS Speaking · Chunk by Chunk</div>
  <h1>语料逐块拆解记忆</h1>
  <div class="sub">每句话拆成独立小块 → 中文理解 + 英文记忆 + 串联成篇</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="view-bar">
  <button class="view-btn active" onclick="switchView('chunk')">■ 逐块学习</button>
  <button class="view-btn" onclick="switchView('chain')">→ 串联成篇</button>
  <span class="hint">先逐块学，再串联背</span>
</div>

<div class="chunk-view" id="chunkView"></div>
<div class="chain-view" id="chainView"></div>

<a href="#top" class="back-top">↑ Back to Top</a>

</div>

<script>
// ===== CHUNKED DATA: Each story broken into sentence-level pieces =====
const stories = [
{id:'A', title:'交易导师 Merit Black', color:'#D94A4A', scenes:[
{sid:'A1', label:'场景1 · 学会听市场',
 chunks:[
  {cn:'我学会了倾听市场在告诉我们什么，而不是试图预测市场会走向何方。', en:"I learned to listen to what the market is telling us, rather than trying to predict where it's going.", note:'核心句式：listen to what X is telling us, rather than trying to predict — 对比结构'},
  {cn:'他的 NADRO 方法论——叙事→接受→DVA→节奏→订单流——给了我一个结构化的方式来解读价格行为和订单流。', en:"His NADRO methodology — Narrative → Acceptance → DVA → Rhythm → Order Flow — gave me a structured way to read price action and order flow.", note:'NADRO 五个字母要能一口气说出来'}
 ]},
{sid:'A2', label:'场景2 · 心态成长',
 chunks:[
  {cn:'他教了我交易的心理层面：真正接受风险，认识到情绪如何蒙蔽判断，理解行为金融学中的偏差，比如损失厌恶和锚定效应。', en:"He taught me the mental side of trading: truly accepting risk, recognizing how emotions cloud judgment, and understanding behavioral finance biases like loss aversion and anchoring.", note:'三个并列：accepting risk / emotions cloud judgment / behavioral biases — 用冒号引出'},
  {cn:'这些都是任何教科书都无法教会我的东西。', en:"These are things no textbook could have taught me.", note:'万能金句：no textbook could have taught me — 任何"人"类题目都可以用来收尾'}
 ]},
{sid:'A3', label:'场景3 · 完整系统',
 chunks:[
  {cn:'作为一名回调交易员，他向我展示了交易是一个完整的系统——而不是零散的技巧。', en:"As a pullback trader, he showed me that trading is a complete system — not scattered techniques.", note:"pullback trader 是具体身份，比 trader 生动。not scattered techniques 是核心对比"},
  {cn:'从叙事到订单流，每一块都紧密相连。', en:"From narrative to order flow, every piece fits together.", note:'呼应 NADRO 五个字母，形成闭环'}
 ]},
{sid:'A4', label:'场景4 · 分享知识',
 chunks:[
  {cn:'最打动我的是他分享知识的意愿。', en:"What strikes me most is his willingness to share knowledge.", note:'What strikes me most — 引出最打动你的一点'},
  {cn:'他的课程任何人随时随地都可以学习。', en:"His courses are available for anyone to learn from.", note:''},
  {cn:'对于他这个级别的人来说，这种慷慨是罕见且令人钦佩的。', en:"For someone at his level, that generosity is rare and admirable.", note:'rare and admirable — 双形容词收尾，更地道'}
 ]}
]},

{id:'B', title:'我的奶奶', color:'#3D8C40', scenes:[
{sid:'B1', label:'场景1 · 菜园',
 chunks:[
  {cn:'她热爱种植蔬菜。', en:"She loved growing vegetables.", note:''},
  {cn:'我仍然记得童年时她那个小菜园，种满了各种有机作物。', en:"I still remember her small garden from my childhood, filled with all kinds of organic produce.", note:'small garden + childhood = 画面感'},
  {cn:'她从不用化肥或农药——她相信自然永远是最好的。', en:"She never used chemical fertilizers or pesticides — she believed that natural was always best.", note:'chemical fertilizers / pesticides — 两个具体名词'},
  {cn:'她常说："土地从不骗人。你付出什么，它就回报什么。"', en:'She used to say, "The soil never lies. What you give, it gives back."', note:'引用原话让故事可信，soil never lies 是最核心的句子'}
 ]},
{sid:'B2', label:'场景2 · 自然哲学',
 chunks:[
  {cn:'她是真正的自然热爱者。', en:"She was a true lover of nature.", note:''},
  {cn:'对她来说，种菜不只是爱好——而是一种生活哲学：尊重自然，与自然和谐共处。', en:"For her, growing vegetables was not just a hobby — it was a philosophy of life: respect nature and live in harmony with it.", note:'not just X — it was Y 的对比句型'},
  {cn:'她教会了我们这一代人什么是可持续生活，远在这个词成为流行语之前。', en:"She taught our generation what sustainable living meant, long before it became a buzzword.", note:'long before it became a buzzword — 展现你认识这个词，同时强调她的超前'}
 ]},
{sid:'B3', label:'场景3 · 她的一生',
 chunks:[
  {cn:'她是一位伟大的母亲和老师。她一边当老师，一边独自抚养了三个孩子。', en:"She was a great mother and teacher. She raised three children on her own while working as a teacher.", note:''},
  {cn:'通过自己的投资，她为家庭留下了一笔可观的财富，确保后代能有更好的生活。', en:"Through her own investments, she managed to leave a considerable amount of wealth for the family, ensuring a better life for the generations after her.", note:'投资这个细节把她从一个传统奶奶的形象提升了——她有现代理财意识'},
  {cn:'她的远见和自律让我深深敬佩。', en:"Her foresight and discipline are things I deeply admire.", note:'foresight 远见 / discipline 自律'}
 ]},
{sid:'B4', label:'场景4 · 最后时光',
 chunks:[
  {cn:'在她最后的日子里，她展现出难以置信的勇气。', en:"In her final days, she showed incredible courage.", note:''},
  {cn:'她在 ICU 里与疾病战斗到最后一刻，从未放弃。', en:"She fought her illness in the ICU until the very end, never giving up.", note:'ICU 国际通用词，不需要解释。never giving up 就两个字但很有力'},
  {cn:'虽然她已离开我们，但她留给我们的——坚韧、智慧、对自然的热爱、对家人的奉献——永远不会褪色。', en:"Though she has left us, what she gave us — resilience, wisdom, a love for nature, and devotion to family — will never fade.", note:'四个名词排列收尾：resilience / wisdom / love for nature / devotion to family'},
  {cn:'我为她感到无比骄傲。', en:"I am so proud of her.", note:'简单收尾，呼应题目 "为家人骄傲"'}
 ]}
]},

{id:'C', title:'发小 / 医生朋友', color:'#C77D20', scenes:[
{sid:'C1', label:'场景1 · 一起长大',
 chunks:[
  {cn:'我们一起长大。从小学就认识，初中和高中都在台南最好的学校同班。', en:"We grew up together. We've known each other since elementary school, and we were in the same class throughout junior high and senior high — both at the best schools in Tainan.", note:'时间线：elementary → junior high → senior high，三个词串起轨迹'},
  {cn:'我们一起学习、一起考试、一起度过了那段成长岁月。', en:"We studied together, took exams together, and went through those formative years side by side.", note:'三个 together 排比。formative years = 成长/塑形期'},
  {cn:'这种童年纽带是你后来认识的朋友永远无法复制的。', en:"That kind of childhood bond is something you can never replicate with friends you meet later in life.", note:'never replicate — 绝对否定，表达这种友谊的独特性'}
 ]},
{sid:'C2', label:'场景2 · 语言天赋',
 chunks:[
  {cn:'他的语言天赋非常惊人。英语流利是一回事——但他还自学了日语和西班牙语，都达到了流利交流的水平。', en:"His talent for languages is extraordinary. Fluent English is one thing, but he also taught himself Japanese and Spanish to a conversational level.", note:'one thing... but also... 结构。Japanese + Spanish 两种语言让例子更具体'},
  {cn:'我问他怎么做到的，他说语言不是死记硬背，而是理解背后的文化和思维方式。', en:"When I asked him how, he said language isn't about rote memorization — it's about understanding the culture and mindset behind it.", note:'rote memorization 死记硬背。culture and mindset 文化和思维。这句可以迁移到很多话题'},
  {cn:'这让我想起 Merit Black 对交易说过的话：先理解底层逻辑。', en:"That reminds me of what Merit Black says about trading: understand the underlying logic first.", note:'这里跨线联动到 Story A，展现你跨领域的思考'}
 ]},
{sid:'C3', label:'场景3 · 学医之路',
 chunks:[
  {cn:'在台湾，学医是只有最顶尖的学生才能走的路。', en:"In Taiwan, studying medicine is reserved for only the very best students.", note:'reserved for — 只有…才能'},
  {cn:'他不仅考上了，还成为了一名优秀的医生。', en:"He not only got in but became an excellent doctor.", note:''},
  {cn:'从台南最好的高中，到医学院，再到临床实践——这条路需要的不仅是聪明，更是非凡的自律和毅力。', en:"From the best high school in Tainan to medical school and then to practice — that path requires not just intelligence, but extraordinary self-discipline and perseverance.", note:'三个节点：high school → med school → practice。not just X but Y 结构'},
  {cn:'他是我认识的最勤奋的人。', en:"He is the hardest-working person I've ever known.", note:'最高级收尾，简单有力'}
 ]}
]},

{id:'D', title:'我的交易学习之路', color:'#4A7FD9', scenes:[
{sid:'D1', label:'场景1 · 起点',
 chunks:[
  {cn:'一切从大学开始。我学的是金融工程，课内课外都泡在金融知识里。', en:"It all started in university. I was studying financial engineering, surrounded by finance knowledge both in and out of class.", note:'both in and out of class — 四个字带出你的沉浸感'},
  {cn:'一个通过乒乓球认识的学长在做比特币量化交易，他让我第一次看到了理论和真实市场之间的差距。', en:"A senior student I'd met through table tennis was doing quantitative trading on Bitcoin, and he showed me the gap between theory and the real market.", note:'table tennis 细节让故事真实。gap between theory and real market — 核心概念'},
  {cn:'我着迷了。心想：作为金融工程学生，我不就应该搞懂这个吗？', en:"I became fascinated. I thought: as a financial engineering student, shouldn't I understand this?", note:'反问句增加自然感'}
 ]},
{sid:'D2', label:'场景2 · 挣扎',
 chunks:[
  {cn:'但这趟旅程远比我想象的艰难。', en:"But the journey was far harder than I expected.", note:''},
  {cn:'交易的世界太大了——基本面分析、技术分析、量化交易——每个分支下又有无数方法和理论。', en:"The trading world is enormous — fundamental analysis, technical analysis, quantitative trading — and each branch has countless methods and theories.", note:'三大分支一口气列出来，显示你真的了解'},
  {cn:'在信息爆炸的时代，垃圾信息和金融骗局到处都是。', en:"In this age of information overload, junk advice and financial scams are everywhere.", note:'information overload / junk advice / scams 三个负面词叠加'},
  {cn:'我什么都想学，结果什么都没学精。', en:"I tried to learn every strategy and mastered none.", note:'every... none 的对比，简洁有力的失败总结'},

  {cn:'我在市场里亏了不少钱，同时一直在寻找一个根本不存在的"圣杯"指标。', en:'I lost quite a bit of money in the market, all while searching for a "holy grail" indicator that doesn\'t exist.', note:'holy grail that doesn\'t exist — 核心隐喻'}
 ]},
{sid:'D3', label:'场景3 · 转折',
 chunks:[
  {cn:'转折点出现在我在 YouTube 上找到一位导师时。', en:"The turning point came when I found a mentor on YouTube.", note:''},

 ]},

{id:'E', title:'日本城崎温泉之旅', color:'#D94A4A', scenes:[

 ]},
{sid:'E2', label:'场景2 · 城崎小镇',
 chunks:[

// ===== RENDER =====
let currentStory = 'ALL';
let currentView = 'chunk';

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '<button class="tab'+(currentStory==='ALL'?' active':'')+'" onclick="selectStory(\'ALL\')">ALL<span class="cnt">'+stories.reduce((s,st)=>s+st.scenes.length,0)+'</span></button>' +
    stories.map(st => {
      const chunks = st.scenes.reduce((sum,sc)=>sum+sc.chunks.length,0);
      return '<button class="tab'+(currentStory===st.id?' active':'')+'" onclick="selectStory(\''+st.id+'\')">'+st.id+'. '+st.title+'<span class="cnt">'+chunks+'块</span></button>';
    }).join('');
}

function renderChunkView() {
  const el = document.getElementById('chunkView');
  const filtered = currentStory==='ALL' ? stories : stories.filter(s=>s.id===currentStory);
  let html = '';

  filtered.forEach(st => {
    html += '<div class="story-hd"><div class="sh-tag">'+st.id+'. '+st.title+'</div><h2>'+st.title+'</h2><div class="sh-meta">'+st.scenes.length+' 个场景 · '+st.scenes.reduce((sum,sc)=>sum+sc.chunks.length,0)+' 个语块</div></div>';

    st.scenes.forEach(sc => {
      html += '<div class="scene-wrap"><div class="scene-label">'+sc.label+'</div>';
      sc.chunks.forEach(ch => {
        html += '<div class="chunk">';
        html += '<div class="c-cn">'+ch.cn+'</div>';
        html += '<div class="c-en">'+ch.en+'</div>';
        if (ch.note) html += '<div class="c-note">'+ch.note+'</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    // Flow line
    html += '<div class="flow-line">';
    st.scenes.forEach((sc, si) => {
      if (si > 0) html += '<span class="flow-arrow">→</span>';
      html += '<span class="flow-node">'+sc.label+'</span>';
    });
    html += '</div>';
  });

  el.innerHTML = html || '<p style="text-align:center;color:var(--muted);padding:60px;">无数据</p>';
}

function renderChainView() {
  const el = document.getElementById('chainView');
  const filtered = currentStory==='ALL' ? stories : stories.filter(s=>s.id===currentStory);
  let html = '';

  filtered.forEach(st => {
    html += '<div class="story-hd"><div class="sh-tag">'+st.id+'. '+st.title+'</div><h2>'+st.title+' — 串联全文</h2></div>';

    st.scenes.forEach(sc => {
      const enSentences = sc.chunks.map(c => c.en);
      const cnSentences = sc.chunks.map(c => c.cn);
      html += '<div class="chain-block">';
      html += '<div class="chain-en">'+enSentences.map((s,i)=>'<span style="color:var(--muted);font-size:10px;font-family:JetBrains Mono,monospace;margin-right:4px">'+(i+1)+'.</span>'+s).join(' ')+'</div>';
      html += '<div class="chain-cn">'+cnSentences.map((s,i)=>'<span style="color:var(--muted);font-size:10px;font-family:JetBrains Mono,monospace;margin-right:4px">'+(i+1)+'.</span>'+s).join(' ')+'</div>';
      html += '</div>';
    });
  });

  el.innerHTML = html || '<p style="text-align:center;color:var(--muted);padding:60px;">无数据</p>';
}

function selectStory(s) {
  currentStory = s;
  renderTabs();
  renderChunkView();
  renderChainView();
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.view-btn'+(view==='chunk'?':nth-child(1)':':nth-child(2)')).classList.add('active');
  document.getElementById('chunkView').classList.toggle('hidden', view!=='chunk');
  document.getElementById('chainView').classList.toggle('visible', view==='chain');
}

// Init
renderTabs();
renderChunkView();
renderChainView();
</script>
